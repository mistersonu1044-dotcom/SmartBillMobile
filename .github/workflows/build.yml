name: Build SmartBill APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SmartBill_Android_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip SmartBill_Android_Project.zip -d extracted

      - name: Build APK
        run: gradle assembleDebug
        working-directory: extracted/smartbill_android

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartBill-APK
          path: extracted/smartbill_android/app/build/outputs/apk/debug/app-debug.apk
